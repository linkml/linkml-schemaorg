site_name: "LinkML Schema.org"
theme:
  name: material
  analytics:
    gtag: G-2SYBSJVZ23
  features:
    - content.tabs.link
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
nav:
  - About: about.md
  - Index: index.md
site_url: https://linkml.github.io/linkml-schemaorg/
repo_url: https://github.com/linkml/linkml-schemaorg/
